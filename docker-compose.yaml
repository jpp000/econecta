services:
  api:
    build:
      context: ./apps/api
      dockerfile: ./Dockerfile
      target: build
    command: pnpm run start:dev
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - ./packages:/app/packages
      - /app/node_modules
    env_file:
      - apps/api/.env
    depends_on:
      - db
    environment:
      - NODE_ENV=development
  
  web:
    build:
      context: ./apps/web
      dockerfile: ./Dockerfile
      target: deps
    command: pnpm run dev --host
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - NODE_ENV=development

  db:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
